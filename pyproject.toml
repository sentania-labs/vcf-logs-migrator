[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vcf-logs-migrator"
version = "0.1.1"
description = "Evidence-driven historical log migration engine and CLI"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["tzdata>=2025.1"]

[project.optional-dependencies]
ssh = ["paramiko>=3.5"]
# 6.12.0 drops one reference to True per signal delivery; on Python 3.11 (bools are not
# immortal) the interpreter aborts at exit after enough slot calls.
gui = ["PySide6>=6.8,<6.12"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
logs-migrate = "logs_migrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logs_migrate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
