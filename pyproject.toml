[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-logs-migrator"
dynamic = ["version"]
description = "Evidence-driven historical log migration engine and CLI"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["tzdata>=2025.1"]

[project.optional-dependencies]
ssh = ["paramiko>=3.5"]
# 6.12.0 drops one reference to True per signal delivery; on Python 3.11 (bools are not
# immortal) the interpreter aborts at exit after enough slot calls.
gui = ["PySide6>=6.8,<6.12"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
logs-migrate = "logs_migrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["logs_migrate*"]

[tool.setuptools.package-data]
"logs_migrate.gui.lattice" = ["*"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = "git describe --dirty --tags --long --match v*"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
