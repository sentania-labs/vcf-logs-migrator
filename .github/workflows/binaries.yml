# Standalone downloads: GUI and CLI built natively and smoke-tested on each platform.
#
# Signing follows vcf-ops-telegraf-helper's binaries workflow through the org's
# shared actions in sentania-labs/.github, pinned by commit: macOS apps are
# Developer ID signed with the hardened runtime, notarized and stapled; Windows
# executables are Authenticode signed through Azure Artifact Signing. The
# credentials are sentania-labs org secrets; nothing is configured in this repo.
# Only validated refs of this repository sign: a push to main, or a vX.Y.Z tag that
# release.yml has validated and calls this workflow for with `sign: true`. Every
# other run (pull requests, manual dispatch on any branch, other repositories) builds
# and smokes unsigned and never references a signing secret. A signing run re-checks
# its ref in "Refuse to sign an unvalidated ref" before any signing step. A signing or
# notarization failure fails the leg.
#
# Placement (github-ci skill): GitHub-hosted. The repository is public, the matrix
# needs Windows and macOS, and no step reaches the lab.

name: Binaries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      sign:
        description: Sign and notarize; release.yml passes true for a validated tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 sets the glibc floor (2.35); PySide6 6.11 itself needs 2.34.
          - platform: linux-x86_64
            os: ubuntu-22.04
            suffix: ""
            minutes: 30
          - platform: windows-x64
            os: windows-2025
            suffix: .exe
            minutes: 45
          - platform: macos-arm64
            os: macos-15
            suffix: .dmg
            minutes: 270
    runs-on: ${{ matrix.os }}
    # macOS includes two Apple notary round trips (app, then disk image), each of which has taken over an hour.
    timeout-minutes: ${{ matrix.minutes }}
    env:
      PLATFORM: ${{ matrix.platform }}
      # Signing secrets are referenced only by steps gated on SIGN.
      SIGN: >-
        ${{ github.repository == 'sentania-labs/vcf-logs-migrator'
        && !startsWith(matrix.platform, 'linux')
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (inputs.sign == true && startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Refuse to sign an unvalidated ref
        if: env.SIGN == 'true'
        run: |
          git fetch -q origin main
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/*)
              [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH; refusing to sign"; exit 1; } ;;
            *) echo "::error::$GITHUB_REF is not main or a release tag; refusing to sign"; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not reachable from main; refusing to sign"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Exact patch: this interpreter is frozen into every download. 3.12.10 is the
          # latest 3.12 that actions/setup-python offers on all three runner images
          # (3.12.11+ are Linux-only in the python-versions manifest).
          python-version: '3.12.10'

      - name: Install Qt runtime and X server for the Linux smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb xauth libegl1 libgl1 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxcb-xkb1 libxcb-randr0 libxcb-shape0 libdbus-1-3 libglib2.0-0

      - name: Simulate a release tag for pull request builds
        if: github.event_name == 'pull_request'
        run: git tag v9999.0.0

      - name: Install the package and pinned build tools
        run: python -m pip install -r packaging/requirements.txt '.[ssh]'

      - name: Verify the simulated tag version
        if: github.event_name == 'pull_request'
        run: |
          [ "$(python packaging/build.py version)" = '9999.0.0' ]
          [ "$(python -c 'import logs_migrate; print(logs_migrate.__version__)')" = '9999.0.0' ]

      - name: Name this build
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(python packaging/build.py version)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="$GITHUB_REF_NAME"
          else label="v${version}-dev.${SHA::7}"; fi
          echo "LABEL=$label" >> "$GITHUB_ENV"
          echo "ARCHIVE=dist/vcf-logs-migrator-$label-$PLATFORM${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Build
        run: python packaging/build.py build "$PLATFORM"

      - name: Sign the app (macOS)
        if: env.SIGN == 'true' && runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-sign@9c071867797b51073ddfdca6d9451083d536656b # sentania-labs/.github latest merged 2026-11-03: macos-notarize retries staple/validate on Apple-side transients
        with:
          bundle: dist/VCF Logs Migrator.app
          macos-cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          macos-team-id: ${{ secrets.MACOS_TEAM_ID }}

      - name: Notarize and staple the app (macOS)
        if: env.SIGN == 'true' && runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-notarize@9c071867797b51073ddfdca6d9451083d536656b # sentania-labs/.github latest merged 2026-11-03: macos-notarize retries staple/validate on Apple-side transients
        with:
          bundle: dist/VCF Logs Migrator.app
          # The action creates a temporary zip to submit the app.
          output-zip: build/notarized-app.zip
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}

      # The disk image is built from the stapled app so the app carries its own ticket
      # once dragged out of the image.
      - name: Package the stapled app (macOS)
        if: runner.os == 'macOS'
        run: python packaging/build.py package "$PLATFORM" --label "$LABEL"

      # macos-notarize removes the signing keychain, so this imports it again. A disk
      # image takes a plain signature: no hardened runtime and no entitlements.
      - name: Sign the disk image (macOS)
        if: env.SIGN == 'true' && runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          password="$(/usr/bin/openssl rand -base64 24)"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          codesign --force --sign "$SIGN_ID" --timestamp "$ARCHIVE"
          codesign --verify --strict --verbose=2 "$ARCHIVE"

      - name: Sign the executables (Windows)
        if: env.SIGN == 'true' && runner.os == 'Windows'
        uses: sentania-labs/.github/.github/actions/windows-sign@9c071867797b51073ddfdca6d9451083d536656b # sentania-labs/.github latest merged 2026-11-03: macos-notarize retries staple/validate on Apple-side transients
        with:
          files: |
            ${{ github.workspace }}\dist\logs-migrate.exe
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Notarize and staple the disk image (macOS)
        if: env.SIGN == 'true' && runner.os == 'macOS'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/vlm-notary-key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          xcrun notarytool submit "$ARCHIVE" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 90m --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          python -c 'import json, sys; result=json.load(open(sys.argv[1])); print(result); sys.exit(result.get("status") != "Accepted")' "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$ARCHIVE"
          xcrun stapler validate "$ARCHIVE"
          codesign --verify --verbose "$ARCHIVE"

      # macos-sign and macos-notarize clean up their own failures; this covers a
      # cancellation or a failure after the disk image is signed.
      - name: Remove the signing keychain (macOS)
        if: always() && env.SIGN == 'true' && runner.os == 'macOS'
        run: security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/signing.keychain-db}" 2>/dev/null || true

      - name: Package the download
        if: runner.os != 'macOS'
        run: python packaging/build.py package "$PLATFORM" --label "$LABEL"

      - name: Smoke-test the download (Linux, X11 under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python packaging/smoke.py "$ARCHIVE" --native

      - name: Smoke-test the download (Windows, macOS)
        if: runner.os != 'Linux'
        run: python packaging/smoke.py "$ARCHIVE" --native ${{ env.SIGN == 'true' && '--signed' || '' }}

      - name: Name platform notices
        run: cp dist/THIRD-PARTY-NOTICES.txt "dist/notices-$PLATFORM.txt"

      - name: Upload the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcf-logs-migrator-${{ matrix.platform }}
          path: |
            ${{ env.ARCHIVE }}
            dist/notices-${{ matrix.platform }}.txt
          if-no-files-found: error

      - name: Upload launch screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-evidence-${{ matrix.platform }}
          path: dist/smoke-evidence/
          if-no-files-found: warn
