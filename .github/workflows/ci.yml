name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Public repository; these fixture-only checks need neither lab access nor Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install Qt platform libraries for the offscreen GUI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install package with the gui extra and check dependencies
        run: python -m pip install '.[dev,gui]'
      - name: Lint and test
        run: make check PYTHON=python
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Exercise installed CLI on both fixtures
        run: make smoke PYTHON=python
