# Release: a vMAJOR.MINOR.PATCH tag on a commit reachable from main builds, signs
# and smoke-tests every download through binaries.yml, then publishes them with
# SHA256SUMS on the tag's GitHub Release.
#
# Signing is mandatory here: validate refuses to start without every signing org
# secret, binaries.yml fails a leg whose signing, notarization or signed smoke
# fails, and publish needs every leg. Nothing unsigned can reach a release. When
# Apple or Azure fails for a reason that is not this build, `gh run rerun <id>
# --failed` resumes against the same tag.
#
# Placement (github-ci skill): GitHub-hosted; nothing here reaches the lab.

name: Release

on:
  push:
    # A broad glob; validate applies the exact pattern.
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # Pinned image: ubuntu-latest is 26.04, where actions/setup-python has no 3.12.10.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Refuse a malformed tag, a tag off main, or a version mismatch
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not reachable from main; refusing to release"; exit 1; }
          embedded="$(python3 packaging/build.py version)"
          [ "v$embedded" = "$GITHUB_REF_NAME" ] || {
            echo "::error::the program reports $embedded but the tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Refuse to start without every macOS signing secret
        uses: sentania-labs/.github/.github/actions/signing-secrets-present@9c071867797b51073ddfdca6d9451083d536656b # sentania-labs/.github latest merged 2026-11-03: macos-notarize retries staple/validate on Apple-side transients
        with:
          macos-cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          macos-team-id: ${{ secrets.MACOS_TEAM_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}

      - name: Refuse to start without every Windows signing secret
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
        run: |
          # Values are tested, never printed; only a missing NAME reaches the log.
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
            ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Windows signing org secrets with no value:$missing"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Same exact interpreter the binaries job freezes into the downloads (see binaries.yml),
          # which ubuntu-24.04 provides.
          python-version: '3.12.10'

      - name: Install Qt platform libraries for the offscreen GUI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Run the test suite and the installed-CLI smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install '.[dev,gui]'
          make check PYTHON=python
          make smoke PYTHON=python

  binaries:
    needs: validate
    uses: ./.github/workflows/binaries.yml
    with:
      sign: true
    secrets: inherit

  publish:
    needs: binaries
    # Pinned image: keep every Linux job on the image whose Python set is pinned (see validate).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download every signed, smoke-tested build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: vcf-logs-migrator-*
          merge-multiple: true

      - name: Check the set and hash the final bytes
        working-directory: release
        run: |
          for platform in linux-x86_64 windows-x64.exe macos-arm64.dmg; do
            [ -f "vcf-logs-migrator-$TAG-$platform" ] || {
              echo "::error::missing vcf-logs-migrator-$TAG-$platform"; exit 1; }
          done
          for platform in linux-x86_64 windows-x64 macos-arm64; do
            [ -f "notices-$platform.txt" ] || { echo "::error::missing notices for $platform"; exit 1; }
            printf '\n===== %s =====\n' "$platform" >> THIRD-PARTY-NOTICES.txt
            cat "notices-$platform.txt" >> THIRD-PARTY-NOTICES.txt
          done
          rm notices-*.txt
          sha256sum vcf-logs-migrator-* THIRD-PARTY-NOTICES.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub Release
        run: |
          cat > notes.md <<EOF
          Standalone downloads: the desktop window and the \`logs-migrate\` CLI over one
          engine. No Python install is needed. License notices are embedded and also provided as THIRD-PARTY-NOTICES.txt.

          Resume a stopped or failed transfer, check capacity for each destination node,
          and see the transfer rate and estimated time remaining. Cached inventory makes
          repeat planning faster. Resume, per-node capacity, and estimates have been validated
          against the simulator only; live appliance checks remain outstanding:
          https://github.com/sentania-labs/vcf-logs-migrator/pull/45

          | Platform | Download | Signature |
          |---|---|---|
          | Windows x64 | vcf-logs-migrator-$TAG-windows-x64.exe | Authenticode (Azure Artifact Signing) |
          | macOS Apple silicon | vcf-logs-migrator-$TAG-macos-arm64.dmg | Developer ID, notarized and stapled |
          | Linux x86_64 (glibc 2.35+) | vcf-logs-migrator-$TAG-linux-x86_64 | SHA256SUMS |

          Verify a download with \`sha256sum -c SHA256SUMS --ignore-missing\`. SmartScreen
          can still warn while the publisher builds reputation. This build runs against real appliances and a
          built-in simulator; docs/testing-against-a-lab.md is the procedure for real hosts.
          EOF
          # A published release is never modified, so a rerun cannot swap verified bytes.
          # A draft left by an interrupted run is refilled from this run, then published.
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$state" in
            false)
              echo "::notice::$TAG is already published; its assets are left unchanged"
              exit 0 ;;
            true)
              gh release upload "$TAG" release/* --clobber
              gh release edit "$TAG" --notes-file notes.md ;;
            *)
              gh release create "$TAG" release/* --draft --verify-tag \
                --title "VCF Logs Migrator $TAG" --notes-file notes.md ;;
          esac
          gh release edit "$TAG" --draft=false
